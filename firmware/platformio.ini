; ROSEyes — Seeed XIAO ESP32S3 Sense + Dual Eye GC9D01 + micro-ROS WiFi
;
; Envs:
;   xiao_esp32s3_eyes_only  — displays + idle/blink (Windows-native flash OK)
;   xiao_esp32s3            — full micro-ROS (build via WSL: scripts/Build-And-Upload-Wsl.ps1)
;   native                  — host unit tests

[platformio]
default_envs = xiao_esp32s3_eyes_only
src_dir = src
include_dir = include
test_dir = test

[esp32_base]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; Match Arduino IDE / board default — 921600 is flaky on native USB CDC.
upload_speed = 460800
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
; Same auto-bootloader path as Arduino IDE (no B/R buttons needed).
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.require_upload_port = yes
build_src_filter =
  +<*>
  -<InMemoryKeyValueStore.cpp>
  -<FakeClock.cpp>
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -Iinclude
  -I../resources/eyes/models

[env:xiao_esp32s3_eyes_only]
extends = esp32_base
build_src_filter =
  ${esp32_base.build_src_filter}
  -<MicroRosEyeNode.cpp>
build_flags =
  ${esp32_base.build_flags}
  -DROSEYES_ENABLE_MICROROS=0

[env:xiao_esp32s3_eyes_only_manual]
extends = env:xiao_esp32s3_eyes_only
upload_flags =
  --before=no_reset
  --after=hard_reset

[env:xiao_esp32s3_eyes_only_ota]
extends = env:xiao_esp32s3_eyes_only
upload_protocol = espota

[env:xiao_esp32s3]
extends = esp32_base
lib_deps =
  https://github.com/micro-ROS/micro_ros_platformio
board_microros_distro = jazzy
board_microros_transport = wifi
build_flags =
  ${esp32_base.build_flags}
  -DROSEYES_ENABLE_MICROROS=1

[env:xiao_esp32s3_manual]
extends = env:xiao_esp32s3
upload_flags =
  --before=no_reset
  --after=hard_reset

[env:xiao_esp32s3_ota]
extends = env:xiao_esp32s3
upload_protocol = espota

[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_deps =
  throwtheswitch/Unity@^2.6.1
build_src_filter =
  +<GazeState.cpp>
  +<BlinkScheduler.cpp>
  +<IdleEyeBehavior.cpp>
  +<WifiCredentialStore.cpp>
  +<InMemoryKeyValueStore.cpp>
  +<FakeClock.cpp>
  +<TofRangeSensorStub.cpp>
  +<EyeFrameBuffer.cpp>
  +<GazeSource.cpp>
  +<EyeMountPolicy.cpp>
build_flags =
  -std=c++17
  -Iinclude
  -DUNIT_TEST
  -DROSEYES_ENABLE_MICROROS=0
