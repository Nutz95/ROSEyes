# Legacy optional path — not required for ROSEyes.

# Prefer the native Windows agent:
#   .\scripts\Install-MicroRosAgent.ps1
#   .\scripts\Start-MicroRosAgent.ps1
#
# This compose file is kept only for environments that already rely on Docker.
services:
  micro-ros-agent:
    image: microros/micro-ros-agent:jazzy
    container_name: roseyes-micro-ros-agent
    restart: unless-stopped
    command: udp4 --port 8888 -v6
    ports:
      - "8888:8888/udp"
